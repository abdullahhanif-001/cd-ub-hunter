sonar.projectKey=abdullahhanif-001_cd-ub-hunter
sonar.projectName=cd-ub-hunter
sonar.projectVersion=1.1.0

# Owned wrapper only — exclude vendored CompDiff/AFL++ (upstream, not maintained here)
sonar.sources=campaigns,config,deploy,portfolio,profiles,scripts,targets,templates,tests
sonar.exclusions=vendor/**,**/*.tar.gz,reports/live/**,work/**,**/bin/**,**/src/**
sonar.sourceEncoding=UTF-8

# Test harness for coverage reporting
sonar.tests=tests
sonar.test.inclusions=tests/**/*
sonar.coverage.exclusions=vendor/**,campaigns/beat-*/**,portfolio/**
